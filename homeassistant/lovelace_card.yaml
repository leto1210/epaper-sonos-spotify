# Carte Lovelace regroupant les entités du boîtier.
#
# À coller dans un tableau de bord Home Assistant, en mode « Modifier en YAML ».
# Les entités apparaissent d'elles-mêmes via MQTT Discovery — voir
# docs/home-assistant.md — à partir de la livraison L11.

type: entities
title: ePaper Sonos
entities:
