# Publie la météo vers le boîtier ePaper, par MQTT.
#
# À coller dans Paramètres > Automatisations > Modifier en YAML, ou dans
# automations.yaml. Adaptez `weather.forecast_maison` à votre entité météo.
#
# Le boîtier ne fait qu'écouter : il n'a ni jeton d'API, ni accès à Home
# Assistant. Le drapeau `retain` lui permet d'afficher la météo dès son
# démarrage, sans attendre la publication suivante.
#
# Le format est volontairement compact : l'ESP32 lit ce JSON avec un tampon de
# taille fixe, et un payload non fragmenté vaut mieux qu'une structure bavarde.
#
# Température et humidité du moment viennent des **sondes locales**, pas de la
# prévision. Un service météo donne la valeur d'une maille régionale : mesuré
# ici, 30,5 °C annoncés contre 28,1 °C relevés au jardin et dans la rue, soit
# 2,4 °C d'écart. Sur un écran qui affiche aussi la température intérieure, la
# comparaison n'a de sens que si les deux chiffres sont des mesures.
#
# Le reste — condition, vent, indice UV, prévisions horaires — ne peut venir que
# du service : aucune sonde ne prédit le temps qu'il fera.
#
# Adaptez `sensor.temperature_exterieure_moyenne` et
# `sensor.maison_salon_maison_exterieur_humidite` à vos entités. Si elles
# manquent ou sont indisponibles, la valeur de la prévision reprend la main.

alias: Météo vers ePaper Sonos
description: Publie conditions et prévisions horaires sur MQTT pour le boîtier ePaper
triggers:
  - trigger: time_pattern
    minutes: "/30"
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_maison
    data:
      type: hourly
    response_variable: prevision

  - action: mqtt.publish
    data:
      topic: reterminal_sonos/weather
      retain: true
      payload: >-
        {% set etat = states.weather.forecast_maison %}
        {# Sondes locales, avec repli sur la prévision si elles se taisent.
           `is_number` écarte d'un coup `unknown`, `unavailable` et l'entité
           absente — trois états qu'un `states()` nu rendrait sous forme de
           chaîne, et qui passeraient alors le filtre `round` en produisant
           zéro. #}
        {% set t_locale = states('sensor.temperature_exterieure_moyenne') %}
        {% set h_locale = states('sensor.maison_salon_maison_exterieur_humidite') %}
        {% set temp = t_locale | float if t_locale | is_number
                      else etat.attributes.temperature %}
        {% set hum = h_locale | float if h_locale | is_number
                     else etat.attributes.humidity %}
        {# Une échéance sur deux, six au total : douze heures de visibilité
           sans surcharger le payload ni la largeur de l'écran. #}
        {% set creneaux = prevision['weather.forecast_maison'].forecast[:12:2] %}
        {% set ns = namespace(heures=[]) %}
        {% for c in creneaux %}
          {% set ns.heures = ns.heures + [{
            "h": as_local(as_datetime(c.datetime)).strftime('%H'),
            "c": c.condition,
            "t": c.temperature | round(1),
            "p": c.precipitation | default(0) | round(1)
          }] %}
        {% endfor %}
        {{
          {
            "ts": now().timestamp() | int,
            "now": {
              "cond": etat.state,
              "temp": temp | round(1),
              "hum": hum | int,
              "wind": etat.attributes.wind_speed | round(0) | int,
              "uv": etat.attributes.uv_index | default(0) | round(1)
            },
            "hourly": ns.heures
          } | to_json
        }}
mode: single
