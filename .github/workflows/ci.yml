name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests unitaires (natif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer PlatformIO
        run: pip install --upgrade platformio
      - name: pio test -e native
        run: pio test -e native

  build:
    name: Compilation ESP32-S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Installer PlatformIO
        run: pip install --upgrade platformio
      - name: Fournir une config factice
        run: cp config.example.h src/config.h
      - name: pio run
        run: pio run -e reterminal_e1002
