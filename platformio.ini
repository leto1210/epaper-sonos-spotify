; ePaper Spotify — afficheur Sonos sur reTerminal E1002 (ESP32-S3)
; https://github.com/leto1210/epaper-sonos-spotify

[platformio]
default_envs = reterminal_e1002

; ---------------------------------------------------------------------------
; Cible : reTerminal E1002 (ESP32-S3, 8 Mo PSRAM OPI, 32 Mo flash)
; ---------------------------------------------------------------------------
[env:reterminal_e1002]
; Fork pioarduino : le paquet `espressif32` du registre PlatformIO est figé sur le
; core Arduino 2.x et ne construit pas pour l'ESP32-S3 avec PSRAM OPI.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.psram_type = opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

build_flags =
	-DBOARD_HAS_PSRAM
	; Le reTerminal E1002 expose son port série via un pont CH340 sur UART0, et
	; non par l'USB natif de l'ESP32-S3. Avec ARDUINO_USB_CDC_ON_BOOT=1, `Serial`
	; part vers le CDC natif et la console reste muette.
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3
	-std=gnu++17
	-Isrc
	; Le Library Dependency Finder ne propage pas les bibliothèques intégrées au
	; core Arduino vers les bibliothèques tierces : Adafruit BusIO ne trouve pas
	; SPI.h, et WiFi ne trouve pas Network.h (scindée depuis le core 3.x). Les
	; chemins sont donc donnés explicitement — déterministe et valable en CI.
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Wire/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
build_unflags = -std=gnu++11

; Bibliothèques intégrées au core Arduino : le LDF ne les résout pas seul pour
; les dépendances tierces. `Network` est requise par `WiFi` depuis le core 3.x.
lib_deps =
	SPI
	Wire
	Network
	WiFi
	https://github.com/Seeed-Studio/Seeed_GFX.git
	bitbank2/JPEGDEC@^1.6.1
	adafruit/Adafruit SHT4x Library@^1.0.5
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------
; Tests unitaires sur la machine de dev — logique pure, sans Arduino.
; Voir src/core/ : tout ce qui y vit doit compiler ici.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags =
	-std=gnu++17
	-Isrc
	-DEPAPER_SPOTIFY_NATIVE_TEST
	; Chemin relatif volontairement : un chemin absolu casse dès que le projet
	; est cloné dans un répertoire contenant une espace. Les tests sont lancés
	; depuis la racine du projet.
	-DFIXTURE_DIR=\"test/fixtures\"
; Compile src/core/ avec les tests — sans quoi le parseur n'est pas lié.
test_build_src = yes
build_src_filter = +<core/>
